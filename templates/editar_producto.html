<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-box">
        <h1>Editar producto</h1>

        <form method="POST" action="/editar_producto/{{ producto[0] }}">
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ producto[1] }}" required>

            <label>Precio:</label>
            <input type="number" name="precio" value="{{ producto[2] }}" step="0.01" required>

            <label>Stock:</label>
            <input type="number" name="stock" value="{{ producto[3] }}" required>

            <button type="submit">Guardar cambios</button>
        </form>

        <p style="margin-top: 1rem; text-align: center;">
            <a href="/inventario">← Volver al inventario</a>
        </p>
    </div>
</body>
</html>
